name: check

# The gate is `make check` and nothing else. Adding a step here that the
# Makefile does not run -- or a Makefile gate this workflow does not run --
# is drift between local and CI, which #66 ATOM-BOOT-006 treats as a broken
# gate. internal/gates/gates_test.go enforces that.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: make check
